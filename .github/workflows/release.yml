name: Build installers (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: build:win
            artifact: ditado-windows
          - os: macos-latest
            command: build:mac
            artifact: ditado-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
